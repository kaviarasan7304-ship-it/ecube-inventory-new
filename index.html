<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eCube TVET Inventory</title>

    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at 10% 10%, rgba(0,210,255,.18), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(90,70,255,.16), transparent 30%),
        linear-gradient(135deg,#06111f,#0b1f35,#07101d);
    color:white;
    padding:20px;
        }
        
      /* ===== BEAUTIFUL E-CUBE DESIGN ===== */



/* Header */
      .big-e{
    font-size:1.6em;
    font-weight:900;
      }
.header{
    display:flex;
    align-items:center;
    gap:18px;
    padding:22px;
    margin-bottom:25px;
    border-radius:22px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);
    box-shadow:0 10px 35px rgba(0,0,0,.30);
    backdrop-filter:blur(15px);
}

/* College Logo */
.college-logo{
    width:150px;
    height:75px;
    object-fit:contain;
    border-radius:12px;
    display:block;
}
      
    

/* Header title */
.header h1{
    margin:0;
    font-size:27px;
    color:white;
}

.header p{
    margin:6px 0 0;
    color:#dbeafe;
    font-size:14px;
}

/* Cards / sections */
.card,
      
.container,
.dashboard,
.form-box,
.inventory-box{
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.20);
    border-radius:20px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    backdrop-filter:blur(14px);
}
.dashboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:25px;
}
      .card{
    padding:20px;
    text-align:center;
    min-height:110px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.card h3{
    margin:0 0 10px;
    font-size:16px;
    color:#dbeafe;
}

.card p{
    margin:0;
    font-size:32px;
    font-weight:700;
    color:white;
}
      .card:nth-child(1){
    border-top:3px solid #38bdf8;
}

.card:nth-child(2){
    border-top:3px solid #22c55e;
}

.card:nth-child(3){
    border-top:3px solid #f59e0b;
}

.card:hover{
    transform:translateY(-6px);
    box-shadow:0 15px 40px rgba(0,0,0,.40);
}
      .card p{
    text-shadow:0 0 15px rgba(255,255,255,.25);
}

.card h3{
    letter-spacing:.5px;
}
      @media (max-width:700px){
    .dashboard{
        grid-template-columns:1fr;
        gap:15px;
    }
      }
/* Inputs */
input,select{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:none;
    border-radius:12px;
    outline:none;
    background:rgba(255,255,255,.95);
    color:#111827;
    font-size:15px;
}
      input:focus,
select:focus{
    box-shadow:0 0 0 3px rgba(56,189,248,.20);
    transform:translateY(-1px);
}

/* Buttons */
button{
    border:none;
    border-radius:12px;
    padding:12px 20px;
    font-weight:bold;
    color:white;
    cursor:pointer;
    background:linear-gradient(135deg,#0ea5e9,#6366f1);
    box-shadow:0 6px 18px rgba(37,99,235,.35);
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(37,99,235,.5);
}

/* Table */
table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
    border-radius:15px;
    background:rgba(255,255,255,.08);
}

th{
    padding:14px;
    background:rgba(14,165,233,.35);
    color:white;
}

td{
    padding:12px;
    border-bottom:1px solid rgba(255,255,255,.12);
    color:#f8fafc;
}

/* Footer */
footer{
    text-align:center;
    margin-top:30px;
    padding:18px;
    color:#cbd5e1;
    font-size:13px;
}
    </style>
</head>

<body>
<div class="header">
    <img src="IMG-20261010-WA0000.jpg" class="college-logo">

    <div>
        <h1><span class="big-e">e</span>Cube TVET College</h1>
        <p>Inventory Management System</p>
    </div>
</div>
  <div class="dashboard">

    <div class="card">
        <h3>Total Items</h3>
    
        <p id="totalItems">0</p>
    </div>

    <div class="card">
        <h3>Available Stock</h3>
        <p id="availableStock">0</p>
    </div>

    <div class="card">
        <h3>Low Stock</h3>
        <p id="lowStock">0</p>
    </div>

</div>
<div class="form-box">

    <h2>Add Inventory Item</h2>

    <input type="text" id="category" placeholder="Enter Category">

    <input type="text" id="itemName" placeholder="Enter Item Name">
    <input type="text" id="location" placeholder="Enter Location (e.g. Computer Lab)">

    <input type="number" id="quantity" placeholder="Enter Quantity">

    <button id="addItemBtn">Add Item</button>

</div>
  <div class="inventory-box">

    <h2>Inventory List</h2>
<button id="pdfBtn">Download PDF</button>
    <input
        type="text"
        id="searchInput"
        placeholder="Search inventory..."
    >

    <table>
        <thead>
            <tr>
                <th>Category</th>
                <th>Item Name</th>
                <th>Location</th>
                <th>Quantity</th>
                <th>Status</th>
              <th>Date &amp; Time</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="inventoryTable">
        </tbody>
    </table>

  </div>
  <script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

 import { getFirestore, collection, addDoc,
onSnapshot, deleteDoc, doc, updateDoc }
from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAFgbWqvQ7FgQUkCEhXsXrhQxHaw84XHNw",
    authDomain: "e-cube-inventory.firebaseapp.com",
    projectId: "e-cube-inventory",
    storageBucket: "e-cube-inventory.firebasestorage.app",
    messagingSenderId: "281755536716",
    appId: "1:281755536716:web:6d529ba17a2ce36c3813e9"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);
document.getElementById("addItemBtn").addEventListener("click", async () => {

    const category = document.getElementById("category").value.trim();
    const itemName = document.getElementById("itemName").value.trim();
    const quantity = Number(document.getElementById("quantity").value);
    const location = document.getElementById("location").value.trim();

if (!category || !itemName || !location || !quantity) {
        alert("Please fill all fields");
        return;
    }

    try {
        await addDoc(collection(db, "inventory"), {
            location: location,
            category: category,
            itemName: itemName,
            quantity: quantity,
            createdAt: new Date()
        });

        alert("Item added successfully!");

        document.getElementById("category").value = "";
        document.getElementById("itemName").value = "";
        document.getElementById("quantity").value = "";
        document.getElementById("location").value = "";

    } catch (error) {
        console.error(error);
        alert("Error adding item");
    }

});
    onSnapshot(collection(db, "inventory"), (snapshot) => {
      let totalItems = snapshot.size;
let availableStock = 0;
let lowStock = 0;

    const tbody = document.querySelector("table tbody");

    if (!tbody) return;

    tbody.innerHTML = "";

    snapshot.forEach((doc) => {

        const item = doc.data();
      if (Number(item.quantity) > 10) {
    availableStock += Number(item.quantity);
} else {
    lowStock += 1;
      }

        const row = document.createElement("tr");

        row.innerHTML = `
    <td>${item.category || ""}</td>
    <td>${item.itemName || ""}</td>
    <td>${item.location || "-"}</td>
    <td>${item.quantity || 0}</td>
    <td>${Number(item.quantity) > 10 ? "✓ Available" : "⚠ Low Stock"}</td>
    <td>${item.createdAt ? new Date(item.createdAt.seconds * 1000).toLocaleString() : "-"}</td>
    <td>
    <button class="edit-btn" data-id="${doc.id}">Edit</button>
    <button class="delete-btn" data-id="${doc.id}">Delete</button>
</td>
`;

        tbody.appendChild(row);
    });
document.getElementById("totalItems").textContent = totalItems;
document.getElementById("availableStock").textContent = availableStock;
document.getElementById("lowStock").textContent = lowStock;
      document.addEventListener("click", async (e) => {
if (e.target.classList.contains("edit-btn")) {

    const id = e.target.dataset.id;

    const category = prompt("Enter Category:");
    if (category === null) return;

    const itemName = prompt("Enter Item Name:");
    if (itemName === null) return;
    const location = prompt("Enter Location:");
if (location === null) return;

    const quantity = prompt("Enter Quantity:");
    if (quantity === null) return;

    try {
        await updateDoc(doc(db, "inventory", id), {
            category: category,
            location: location,
            itemName: itemName,
            quantity: Number(quantity)
        });

        alert("Item updated successfully!");

    } catch (error) {
        console.error(error);
        alert("Error updating item");
    }
}
    if (e.target.classList.contains("delete-btn")) {

        const id = e.target.dataset.id;

        if (confirm("Are you sure you want to delete this item?")) {
            try {
                await deleteDoc(doc(db, "inventory", id));
                alert("Item deleted successfully!");
            } catch (error) {
                console.error(error);
                alert("Error deleting item");
            }
        }
    }

});
});
document.getElementById("pdfBtn").addEventListener("click", () => {

    const table = document.querySelector("table");

    if (!table) {
        alert("Inventory table not found");
        return;
    }

    const printArea = document.createElement("div");
    printArea.id = "pdfPrintArea";
printArea.style.display = "none";
    const tableClone = table.cloneNode(true);

    tableClone.querySelectorAll("tr").forEach(row => {
        if (row.lastElementChild) {
            row.lastElementChild.remove();
        }
    });

    printArea.innerHTML = `
        <h1>eCube TVET College</h1>
        <h2>Inventory Management Report</h2>
        <p>Generated: ${new Date().toLocaleString()}</p>
        ${tableClone.outerHTML}
    `;

    document.body.appendChild(printArea);

    const style = document.createElement("style");
    style.id = "pdfPrintStyle";

    style.innerHTML = `
        @media print {
            body > *:not(#pdfPrintArea) {
                display: none !important;
            }

            #pdfPrintArea {
                display: block !important;
                padding: 30px;
                font-family: Arial, sans-serif;
                color: #000;
                background: #fff;
            }

            #pdfPrintArea h1,
            #pdfPrintArea h2 {
                text-align: center;
            }

            #pdfPrintArea table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
            }

            #pdfPrintArea th,
            #pdfPrintArea td {
                border: 1px solid #333;
                padding: 10px;
                text-align: left;
            }

            #pdfPrintArea th {
                background: #eee;
            }
        }
    `;

    document.head.appendChild(style);

    window.onafterprint = () => {
        printArea.remove();
        style.remove();
        window.onafterprint = null;
    };

    window.print();
});
        
  </script>
</body>
</html>
